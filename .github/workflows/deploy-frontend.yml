name: Auto Build & Deploy Smansa Frontend

# Trigger: Jalan otomatis ketika Pull Request di-merge ke branch main
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  # Opsional: Bisa juga jalan kalau kamu push langsung ke main
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    # Jalankan jika ini adalah push biasa ATAU PR yang benar-benar di-merge
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Path ke package-lock di dalam folder Frontend
          cache-dependency-path: './Frontend/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: 🏗️ Build Project
        working-directory: ./Frontend
        run: npm run build
        env:
          # Pastikan URL API sudah benar (tanpa double slash di akhir)
          VITE_API_BASE_URL: http://api.smansa.m-tech.fun

      - name: 🚀 Upload ke VPS via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          protocol: sftp
          port: 22
          # Mengambil hasil build dari folder Frontend/dist
          local-dir: ./Frontend/dist/
          # Mengirim ke folder tujuan di VPS
          server-dir: /var/www/html/smansa/frontend/dist/
          # Jangan hapus file lain di server agar tidak merusak folder lain
          delete-destination: false
          # Jika butuh pengecualian file tertentu:
          # exclude: |
          #   **/.git*
          #   **/node_modules/**