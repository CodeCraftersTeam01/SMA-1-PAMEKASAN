name: Auto Build & Deploy Smansa (Frontend, Landing Page, & Backend)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            Frontend/package-lock.json
            landingpages/package-lock.json

      - name: 📦 Install Frontend (Dashboard) Dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Frontend (Dashboard) Project
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.smansa.m-tech.fun
          VITE_LANDING_PAGE_URL: https://smansa.m-tech.fun
          VITE_API_KEY: smansa123

      - name: 📦 Install Landing Page Dependencies
        working-directory: ./landingpages
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Landing Page Project
        working-directory: ./landingpages
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.smansa.m-tech.fun
          VITE_API_URL: https://api.smansa.m-tech.fun
          VITE_DASHBOARD_URL: https://dashboard.smansa.m-tech.fun
          VITE_API_KEY: smansa123

      - name: 🛠️ Prepare and Clean Directories on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p ~/dashboard/dist
            rm -rf ~/dashboard/dist/*
            mkdir -p ~/frontend/dist
            rm -rf ~/frontend/dist/*

      - name: 🚀 Upload Frontend (Dashboard) Dist to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "Frontend/dist/*"
          target: "dashboard/dist/"
          strip_components: 2
          rm: false

      - name: 🚀 Upload Landing Page (Frontend) Dist to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "landingpages/dist/*"
          target: "frontend/dist/"
          strip_components: 2
          rm: false

      - name: 🚀 Upload Backend to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "BackendLumen/app,BackendLumen/bootstrap,BackendLumen/config,BackendLumen/database,BackendLumen/public,BackendLumen/resources,BackendLumen/routes,BackendLumen/storage,BackendLumen/artisan,BackendLumen/composer.json,BackendLumen/composer.lock"
          target: "api/"
          strip_components: 1
          rm: false

      - name: 🛠️ Post-Deployment Backend Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/api
            composer install --no-dev --optimize-autoloader
            php artisan migrate
            chmod -R 775 storage || true
