name: Auto Build & Deploy Smansa (Frontend & Backend)

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Frontend Project
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.smansa.m-tech.fun

      - name: 🚀 Upload Frontend Dist to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "Frontend/dist/*"
          target: "frontend/dist/"
          strip_components: 2
          rm: true

      - name: 🚀 Upload Backend to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "BackendLumen/app,BackendLumen/bootstrap,BackendLumen/config,BackendLumen/database,BackendLumen/public,BackendLumen/resources,BackendLumen/routes,BackendLumen/storage,BackendLumen/artisan,BackendLumen/composer.json,BackendLumen/composer.lock"
          target: "api/"
          strip_components: 1
          rm: false

      - name: 🛠️ Post-Deployment Backend Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/api
            composer install --no-dev --optimize-autoloader
            php artisan migrate
            chmod -R 775 storage bootstrap/cache
