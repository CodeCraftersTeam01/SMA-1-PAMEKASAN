name: Auto Build & Deploy Smansa Frontend

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./Frontend
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Project
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://api.smansa.m-tech.fun

      - name: 🚀 Upload Dist to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "Frontend/dist/*"
          target: "frontend/dist/"
          strip_components: 2 # Ini penting agar folder 'Frontend/dist' tidak ikut terbuat di server
          rm: true